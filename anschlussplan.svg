<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest">
<!-- Magnetic-Fin-Gripper  Copyright (C) 2026  Stefan Rohringer. SPDX-License-Identifier: CERN-OHL-S-2.0 (see LICENSE-HARDWARE) -->
<metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="520" fill="#fff"/>
<text x="20" y="30" font-size="20" font-weight="bold">Anschlussplan Greifer-Sensorik (Stern über Hub)</text>
<!-- PC -->
<rect x="20" y="220" width="110" height="70" rx="8" fill="#eee" stroke="#333"/>
<text x="75" y="250" text-anchor="middle" font-weight="bold">PC</text>
<text x="75" y="272" text-anchor="middle" font-size="12">eigene USB-Buchse</text>
<line x1="130" y1="255" x2="200" y2="255" stroke="#333" stroke-width="4"/>
<text x="165" y="245" text-anchor="middle" font-size="12">USB</text>
<!-- Pico -->
<rect x="200" y="190" width="150" height="130" rx="8" fill="#cfe8cf" stroke="#2a6"/>
<text x="275" y="212" text-anchor="middle" font-weight="bold">Pico</text>
<text x="210" y="240" font-size="13">Pin 36  3V3 OUT</text>
<text x="210" y="262" font-size="13">Pin 38  GND</text>
<text x="210" y="284" font-size="13">Pin 6   GP4 (SDA)</text>
<text x="210" y="306" font-size="13">Pin 7   GP5 (SCL)</text>
<!-- adapter wires -->
<line x1="350" y1="236" x2="420" y2="246" stroke="#d00" stroke-width="3"/>
<line x1="350" y1="258" x2="420" y2="252" stroke="#000" stroke-width="3"/>
<line x1="350" y1="280" x2="420" y2="258" stroke="#06c" stroke-width="3"/>
<line x1="350" y1="302" x2="420" y2="264" stroke="#db0" stroke-width="3"/>
<text x="385" y="330" text-anchor="middle" font-size="12">Adapterkabel 15 cm</text>
<text x="385" y="346" text-anchor="middle" font-size="12">(weibliche Kontakte)</text>
<!-- Hub -->
<rect x="420" y="200" width="110" height="110" rx="8" fill="#ddd" stroke="#333"/>
<text x="475" y="250" text-anchor="middle" font-weight="bold">Hub</text>
<text x="475" y="270" text-anchor="middle" font-size="12">Adafruit 5625</text>
<!-- sensors -->
<g font-size="13">
<rect x="700" y="60" width="180" height="70" rx="6" fill="#cde" stroke="#036"/>
<text x="790" y="88" text-anchor="middle" font-weight="bold">L1  0x18</text>
<text x="790" y="110" text-anchor="middle">keine Brücke</text>
<rect x="700" y="160" width="180" height="70" rx="6" fill="#cde" stroke="#036"/>
<text x="790" y="188" text-anchor="middle" font-weight="bold">L2  0x19</text>
<text x="790" y="210" text-anchor="middle">Brücke A0</text>
<rect x="700" y="280" width="180" height="70" rx="6" fill="#edc" stroke="#630"/>
<text x="790" y="308" text-anchor="middle" font-weight="bold">R1  0x1A</text>
<text x="790" y="330" text-anchor="middle">Brücke A1</text>
<rect x="700" y="380" width="180" height="70" rx="6" fill="#edc" stroke="#630"/>
<text x="790" y="408" text-anchor="middle" font-weight="bold">R2  0x1B</text>
<text x="790" y="430" text-anchor="middle">Brücken A0 + A1</text>
</g>
<g stroke="#555" stroke-width="3" fill="none">
<path d="M530 215 C600 215 620 95 700 95"/>
<path d="M530 240 C600 240 620 195 700 195"/>
<path d="M530 270 C600 270 620 315 700 315"/>
<path d="M530 295 C600 295 620 415 700 415"/>
</g>
<text x="615" y="480" text-anchor="middle" font-size="13">je Sensor 1 Kabel SH–SH (20/30/50 cm), oberer Stecker der Platine</text>
<text x="20" y="500" font-size="13">Farben: rot 3V3 · schwarz GND · blau SDA · gelb SCL.  Pico und Hub sitzen zusammen am Handgelenk, nur das USB-Kabel läuft am Arm entlang.</text>
</svg>
